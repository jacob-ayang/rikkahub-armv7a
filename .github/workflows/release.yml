name: ARMv7 Build and Release

on:
  # Bootstrap the first signed test APK without requiring Actions API write access.
  # Remove this branch-only trigger after the initial validation run succeeds.
  push:
    branches: [fix/armv7-automation]
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Exact upstream official tag (empty synchronizes master only)"
        type: string
        required: false
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      upstream_tag:
        type: string
        required: false
        default: ""
      base_sha:
        type: string
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: armv7-build-${{ inputs.upstream_tag || 'sync' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      ready: ${{ steps.status.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_SHA: ${{ inputs.upstream_sha }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('automation', 'scripts/ci/automation.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tag = os.environ['REQUESTED_TAG']
          if os.environ['EVENT_NAME'] == 'push':
              tag = module.config()['release_baseline']['tag']
          mode = os.environ['REQUESTED_MODE'] or ('release' if tag else 'sync')
          if mode not in ('sync', 'release') or (mode == 'release' and not tag):
              raise ValueError('Release mode requires an upstream official tag')
          if mode == 'sync' and tag:
              raise ValueError('Daily sync cannot use a release tag or a release source tree')
          upstream = module.GitHub(module.config()['upstream'])
          if tag:
              release = upstream.release(tag)
              if not release or release['draft'] or release['prerelease']:
                  raise ValueError('Only published official upstream releases are supported')
          sha = upstream.sha(tag or module.config()['branch'])
          expected = os.environ['REQUESTED_SHA']
          if expected and (tag and sha != expected):
              raise ValueError('Upstream tag moved since the controller resolved it')
          # A daily sync builds the controller snapshot even if master moved since planning.
          module.output('sha', expected or sha)
          module.output('mode', mode)
          module.output('tag', tag)
          PYCODE
      - id: status
        if: steps.resolve.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        run: python3 scripts/ci/automation.py status --tag "$TAG" --upstream-sha "$UPSTREAM_SHA"

  build:
    needs: resolve
    if: needs.resolve.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test controller and overlay
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Prepare exact upstream snapshot with fork adaptations
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          args=(--target source --upstream-sha "$UPSTREAM_SHA" --tag "$TAG")
          if [ -n "$BASE_SHA" ]; then args+=(--base-sha "$BASE_SHA"); fi
          python3 scripts/ci/automation.py prepare "${args[@]}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: source/web-ui/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: source/web-ui
        run: pnpm install --frozen-lockfile
      - name: Install checksum-locked Android SDK command-line tools
        working-directory: source
        run: python3 scripts/ci/setup-android.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Validate and decode signing and Firebase configuration
        working-directory: source
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG_B64: ${{ secrets.SIGNING_CONFIG_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: python3 scripts/ci/prepare-build-secrets.py
      - name: Build checksum-locked ARMv7a native components
        working-directory: source
        run: python3 scripts/ci/build-native.py
      - name: Build signed APK and run regression tests
        working-directory: source
        run: |
          bash gradlew :app:assembleGithubRelease :app:testGithubReleaseUnitTest \
            :workspace:testReleaseUnitTest :terminal:testReleaseUnitTest \
            --stacktrace --build-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify APK architecture, native dependencies and upgrade signature
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 scripts/ci/verify-apk.py --tag "$TAG"
      - name: Preserve verified release source commit
        if: needs.resolve.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/automation.py persist --target source
      - name: Upload and verify draft release assets
        if: needs.resolve.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/ci/automation.py upload --directory source/build-output --tag "$TAG" --upstream-sha "$UPSTREAM_SHA"
      - name: Advance master after successful validation
        if: needs.resolve.outputs.mode == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
        run: python3 scripts/ci/automation.py advance --target source --base-sha "$BASE_SHA"
      - name: Save first-device test APK and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armv7a-${{ needs.resolve.outputs.mode }}-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/build-output/*
            source/**/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Remove decoded secrets
        if: always()
        run: rm -f source/rikkahub.keystore source/local.properties source/app/google-services.json

  publish:
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'release' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Publish only after first-device approval
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/ci/automation.py publish --tag "$TAG" --upstream-sha "$UPSTREAM_SHA"
      - name: Report validation state
        env:
          AWAITING_DEVICE: ${{ steps.publish.outputs.awaiting_device }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Awaiting first-device validation: $AWAITING_DEVICE" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [resolve, build, publish]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Report only completed stages
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVE: ${{ needs.resolve.result }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
          MODE: ${{ needs.resolve.outputs.mode }}
          READY: ${{ needs.resolve.outputs.ready }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [ "$RESOLVE" != success ]; then
            python3 scripts/ci/automation.py report --stage resolution --result "$RESOLVE"
          else
            python3 scripts/ci/automation.py report --stage resolution --result success
          fi
          if [ "$BUILD" != skipped ]; then
            python3 scripts/ci/automation.py report --stage "${MODE:-unknown}-build-${TAG:-master}" --result "$BUILD"
          elif [ "$READY" = true ]; then
            python3 scripts/ci/automation.py report --stage "${MODE:-unknown}-build-${TAG:-master}" --result success
          fi
          if [ "$PUBLISH" != skipped ]; then
            python3 scripts/ci/automation.py report --stage "publish-$TAG" --result "$PUBLISH"
          fi
