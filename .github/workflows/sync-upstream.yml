name: Sync Upstream

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: armv7-controller
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      sync: ${{ steps.plan.outputs.sync }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      releases: ${{ steps.plan.outputs.releases }}
      has_releases: ${{ steps.plan.outputs.has_releases }}
    steps:
      - uses: actions/checkout@v6
      - name: Test automation
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Resolve immutable sources and unfinished releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/automation.py plan
      - name: Report planning result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: python3 scripts/ci/automation.py report --stage planning --result "$RESULT"

  sync:
    needs: plan
    if: needs.plan.outputs.sync == 'true'
    uses: ./.github/workflows/release.yml
    with:
      mode: sync
      upstream_sha: ${{ needs.plan.outputs.upstream_sha }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
    secrets: inherit

  releases:
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.releases) }}
    uses: ./.github/workflows/release.yml
    with:
      mode: release
      upstream_sha: ${{ matrix.sha }}
      upstream_tag: ${{ matrix.tag }}
    secrets: inherit

  summary:
    needs: [plan, sync, releases]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize independent synchronization and releases
        env:
          PLAN: ${{ needs.plan.result }}
          SYNC: ${{ needs.sync.result }}
          RELEASES: ${{ needs.releases.result }}
          UPSTREAM_SHA: ${{ needs.plan.outputs.upstream_sha }}
        run: |
          {
            echo '## ARMv7a automation'
            echo "Planning: $PLAN"
            echo "Daily synchronization: $SYNC"
            echo "Official releases: $RELEASES"
            echo "Upstream SHA: $UPSTREAM_SHA"
            echo 'First-device validation is controlled by fork/config.json; unapproved releases remain drafts.'
          } >> "$GITHUB_STEP_SUMMARY"
