// Applied after the upstream app configuration. Keep the upstream distribution flavors.
def forkNdkVersion = new groovy.json.JsonSlurper().parse(rootProject.file('fork/config.json')).ndk as String
plugins.withId('com.android.application') {
    android {
        defaultConfig {
            ndk {
                abiFilters.clear()
                abiFilters.add('armeabi-v7a')
            }
        }
        splits {
            abi {
                enable = false
            }
        }
        ndkVersion = forkNdkVersion
        signingConfigs {
            release {
                def signing = new Properties()
                def configFile = rootProject.file('local.properties')
                if (configFile.exists()) {
                    configFile.withInputStream { signing.load(it) }
                    def keyPath = signing.getProperty('storeFile')
                    if (keyPath != null) storeFile = rootProject.file(keyPath)
                }
            }
        }
    }
}
